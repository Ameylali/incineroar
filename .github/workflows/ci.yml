name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Check app builds
      run: npm run build

    - name: Run lint check
      run: npm run lint
    
    - name: Check TypeScript compilation
      run: npm run compile
    
    - name: Generate mocks
      run: npm run genmocks
    
    - name: Run unit tests
      run: npm test
